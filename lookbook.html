<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Nakus Beauty Studio</title>
  <meta name="description" content="Silk presses, braids, wigs, gentlemen’s cuts, children’s styles, nails and make-up from Nakus Beauty Studio, Airport Residential. Add any look to your booking.">
  <meta name="theme-color" content="#0A0F1C">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="lookbook">

  <main>
    <section class="phead">
      <div class="wrap">
        <h1 class="h-xl" data-lines="manual">Gallery.</h1>
        <p class="lead muted" data-rise>Open any photograph and add it to your booking. A picture is the quickest way to tell your stylist what you have in mind.</p>
      </div>
    </section>

    <section class="sec s-porcelain" style="padding-top:clamp(40px,5vw,64px)">
      <div class="wrap">
        <div class="tabs glass" id="lbTabs" role="group" aria-label="Filter the gallery">
          <button class="tab" aria-pressed="true" data-who="all">Everything</button>
          <button class="tab" aria-pressed="false" data-who="women">Women</button>
          <button class="tab" aria-pressed="false" data-who="men">Men</button>
          <button class="tab" aria-pressed="false" data-who="kids">Kids</button>
          <button class="tab" aria-pressed="false" data-who="beauty">Beauty</button>
        </div>
        <div class="book-grid" id="lbGrid"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__x" id="lbClose">Close</button>
    <button class="arrow" id="lbPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption class="glass-d"><span id="lbName"></span><button type="button" class="add" id="lbAdd" data-add-svc="w1" data-label="Add to booking"></button></figcaption>
    </figure>
    <button class="arrow" id="lbNext" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <footer data-foot></footer>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
